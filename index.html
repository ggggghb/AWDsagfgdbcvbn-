<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الذكاء الاصطناعي الفائقة</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>

    <style>
        :root {
            --bg-base: #090a0f;
            --bg-surface: rgba(18, 20, 29, 0.85);
            --bg-card: rgba(26, 30, 44, 0.75);
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(99, 102, 241, 0.3);
            --code-bg: #1e1e2e;
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
        }

        .glass-panel {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        header {
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            font-size: 1.6rem;
            color: var(--accent-primary);
            -webkit-text-fill-color: initial;
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 80px);
        }

        .chat-container {
            flex: 1;
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .message {
            display: flex;
            gap: 1rem;
            max-width: 88%;
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .user .avatar {
            background: var(--accent-gradient);
            color: white;
        }

        .bot .avatar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-highlight);
            color: var(--accent-primary);
        }

        .msg-content {
            background: var(--bg-card);
            padding: 1.25rem 1.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-glass);
            line-height: 1.7;
            font-size: 1rem;
            color: var(--text-main);
            overflow-x: auto;
            word-break: break-word;
        }

        .user .msg-content {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
            border-top-left-radius: 4px;
        }

        .bot .msg-content {
            border-top-right-radius: 4px;
        }

        .code-draft-wrapper {
            margin: 1rem 0;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-highlight);
            background: var(--code-bg);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .code-header {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .action-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        pre code {
            padding: 1rem !important;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
            direction: ltr;
            text-align: left;
            display: block;
            overflow-x: auto;
        }

        .generated-image-card {
            margin-top: 1rem;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-highlight);
            background: var(--bg-card);
            position: relative;
        }

        .image-skeleton {
            width: 100%;
            height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(15, 18, 28, 0.8);
            color: var(--accent-primary);
        }

        .image-skeleton i {
            font-size: 2.5rem;
            animation: pulse 1.5s infinite;
        }

        .image-skeleton span {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        .generated-image-card img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            display: none;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .generated-image-card img:hover {
            transform: scale(1.01);
        }

        .image-actions {
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease;
        }

        .lightbox-modal img {
            max-width: 90%;
            max-height: 85%;
            border-radius: var(--radius-md);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 1px solid var(--border-glass);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .lightbox-close:hover {
            color: var(--accent-primary);
        }

        .input-area {
            padding: 1.25rem;
            border-top: 1px solid var(--border-glass);
            background: rgba(10, 12, 18, 0.85);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 8px 12px;
            transition: border-color 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            max-height: 150px;
            min-height: 48px;
            padding: 10px;
            line-height: 1.5;
        }

        .send-btn {
            background: var(--accent-gradient);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: transform 0.2s ease, opacity 0.2s ease;
            align-self: flex-end;
        }

        .send-btn:hover {
            transform: scale(1.05);
            opacity: 0.95;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .typing {
            display: flex;
            gap: 6px;
            padding: 8px 0;
            align-items: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: wave 1.3s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <header class="glass-panel">
        <div class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>مُساعد الذكاء الاصطناعي الفائق</span>
        </div>
    </header>

    <main>
        <div class="chat-container glass-panel">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content">
                        أهلاً بك! أنا مساعدك الذكي المتطور. أستطيع كتابة الأكواد البرمجية، وتصميم وتوليد الصور واستعراضها وتحميلها، والإجابة عن جميع استفساراتك بدقة. كيف يمكنني مساعدتك اليوم؟
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="اكتب سؤالك، طلبك البرمجي، أو صف صورة لتوليدها..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </main>

    <div class="lightbox-modal" id="lightboxModal">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightboxImg" src="" alt="Preview">
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');

        let messageHistory = [];

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight > 150 ? 150 : this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            messageHistory.push({ role: "user", content: text });
            const typingElem = appendTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messageHistory })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                typingElem.remove();

                if (data.reply) {
                    const aiReply = data.reply;
                    messageHistory.push({ role: "assistant", content: aiReply });
                    appendBotResponse(aiReply);
                } else {
                    appendMessage('bot', 'عذراً، لم يتم استلام رد صحيح من المزود.');
                }
            } catch (err) {
                console.error(err);
                typingElem.remove();
                appendMessage('bot', 'عذراً، تعذر الاتصال بالخادم. تأكد من نشر التطبيق على Vercel وإضافة مفتاح Groq في متغير البيئة GROQ_API_KEY.');
            }

            sendBtn.disabled = false;
        }

        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'msg-content';
            contentDiv.textContent = content;

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(contentDiv);
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendTypingIndicator() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';
            msgDiv.innerHTML = `
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-content">
                    <div class="typing">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv;
        }

        function appendBotResponse(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'msg-content';

            const imgMatch = text.match(/\[IMAGE:\s*(.*?)\]/);
            
            let cleanText = text;
            if (imgMatch) {
                cleanText = text.replace(/\[IMAGE:\s*(.*?)\]/g, '');
            }

            contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(cleanText));

            contentDiv.querySelectorAll('pre').forEach((pre) => {
                const codeElem = pre.querySelector('code');
                const lang = codeElem.className.replace('language-', '') || 'code';
                
                const wrapper = document.createElement('div');
                wrapper.className = 'code-draft-wrapper';

                const header = document.createElement('div');
                header.className = 'code-header';
                const languageLabel = document.createElement('span');
                languageLabel.textContent = lang;
                const copyButton = document.createElement('button');
                copyButton.className = 'action-btn';
                copyButton.innerHTML = '<i class="fa-regular fa-copy"></i> نسخ الكود';
                copyButton.addEventListener('click', () => copyCode(copyButton));
                header.append(languageLabel, copyButton);

                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(header);
                wrapper.appendChild(pre);
            });

            if (imgMatch && imgMatch[1]) {
                const seed = Math.floor(Math.random() * 100000);
                const prompt = encodeURIComponent(imgMatch[1].trim());
                const imgUrl = `https://image.pollinations.ai/prompt/${prompt}?width=1024&height=768&nologo=true&seed=${seed}`;

                const imgCard = document.createElement('div');
                imgCard.className = 'generated-image-card';
                imgCard.innerHTML = `
                    <div class="image-skeleton">
                        <i class="fa-solid fa-palette"></i>
                        <span>جاري رسم ملامح الصورة...</span>
                    </div>
                    <img alt="Generated AI Image" />
                    <div class="image-actions">
                        <span style="font-size:0.85rem; color:var(--text-muted);"><i class="fa-solid fa-image"></i> مسودة صورة</span>
                        <div class="btn-group">
                            <button class="action-btn preview-image">
                                <i class="fa-solid fa-expand"></i> استعراض
                            </button>
                            <button class="action-btn download-image">
                                <i class="fa-solid fa-download"></i> تحميل
                            </button>
                            <button class="action-btn copy-image-url">
                                <i class="fa-solid fa-link"></i> رابط
                            </button>
                        </div>
                    </div>
                `;
                const image = imgCard.querySelector('img');
                image.src = imgUrl;
                image.addEventListener('click', () => openLightbox(imgUrl));
                image.addEventListener('load', () => imageLoaded(image));
                imgCard.querySelector('.preview-image').addEventListener('click', () => openLightbox(imgUrl));
                imgCard.querySelector('.download-image').addEventListener('click', (event) => downloadImage(imgUrl, event.currentTarget));
                imgCard.querySelector('.copy-image-url').addEventListener('click', (event) => copyImageUrl(imgUrl, event.currentTarget));
                contentDiv.appendChild(imgCard);
            }

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(contentDiv);
            chatMessages.appendChild(msgDiv);
            
            hljs.highlightAll();
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        window.imageLoaded = function(img) {
            const skeleton = img.previousElementSibling;
            if (skeleton) systemHide(skeleton);
            img.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        };

        function systemHide(el) { el.style.display = 'none'; }

        window.openLightbox = function(url) {
            lightboxImg.src = url;
            lightboxModal.style.display = 'flex';
        };

        window.closeLightbox = function() {
            lightboxModal.style.display = 'none';
        };

        window.downloadImage = async function(url, button) {
            const originalHTML = button.innerHTML;
            button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...';
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `AI-Image-${Date.now()}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                button.innerHTML = '<i class="fa-solid fa-check"></i> تم التحميل!';
            } catch (err) {
                window.open(url, '_blank');
                button.innerHTML = originalHTML;
            }
            setTimeout(() => { button.innerHTML = originalHTML; }, 2500);
        };

        window.copyCode = function(button) {
            const wrapper = button.closest('.code-draft-wrapper');
            const codeText = wrapper.querySelector('code').innerText;

            navigator.clipboard.writeText(codeText).then(() => {
                button.innerHTML = '<i class="fa-solid fa-check"></i> تم النسخ!';
                button.style.background = '#22c55e';
                setTimeout(() => {
                    button.innerHTML = '<i class="fa-regular fa-copy"></i> نسخ الكود';
                    button.style.background = '';
                }, 2000);
            });
        };

        window.copyImageUrl = function(url, button) {
            navigator.clipboard.writeText(url).then(() => {
                button.innerHTML = '<i class="fa-solid fa-check"></i> تم النسخ!';
                button.style.background = '#22c55e';
                setTimeout(() => {
                    button.innerHTML = '<i class="fa-solid fa-link"></i> رابط';
                    button.style.background = '';
                }, 2000);
            });
        };
    </script>
</body>
</html>
